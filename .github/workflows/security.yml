name: Security

# Phase 5 security pass (phase prompt task 7): dependency, secret and image scanning. The build must
# fail on a high-severity dependency vulnerability and on a planted secret (proven once, then the
# planted artifact removed). Separate from ci.yml so a scan-only change does not re-run the full IT.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 3 * * 1' # weekly, to catch newly disclosed CVEs in pinned deps

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks scans history, not just the tip
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_CONFIG: .gitleaks.toml

  dependency-scan:
    runs-on: ubuntu-latest
    env:
      TRIVY_VERSION: v0.69.3
    steps:
      - uses: actions/checkout@v4
      # Install the Trivy CLI directly (the trivy-action composite pins a setup-trivy tag that has
      # been known to vanish; the CLI install is self-contained and reproducible).
      - name: Install Trivy
        run: curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin "${TRIVY_VERSION}"
      - name: Dependency vulnerability scan (Trivy fs)
        run: trivy fs --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 .

  image-scan:
    runs-on: ubuntu-latest
    env:
      TRIVY_VERSION: v0.69.3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Install Trivy
        run: curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin "${TRIVY_VERSION}"
      - name: Build a representative image (Jib -> local Docker)
        run: ./mvnw -B -ntp -pl services/gateway -am -DskipTests package jib:dockerBuild
      - name: Image scan (Trivy)
        run: trivy image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 lms/gateway:0.1.0-SNAPSHOT
