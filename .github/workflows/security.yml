name: Security

# Phase 5 security pass (phase prompt task 7): dependency, secret and image scanning. The build must
# fail on a high-severity dependency vulnerability and on a planted secret (proven once, then the
# planted artifact removed). Separate from ci.yml so a scan-only change does not re-run the full IT.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 3 * * 1' # weekly, to catch newly disclosed CVEs in pinned deps

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks scans history, not just the tip
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_CONFIG: .gitleaks.toml

  dependency-scan:
    runs-on: ubuntu-latest
    env:
      TRIVY_VERSION: v0.69.3
    steps:
      - uses: actions/checkout@v4
      # Install the Trivy CLI directly (the trivy-action composite pins a setup-trivy tag that has
      # been known to vanish; the CLI install is self-contained and reproducible).
      - name: Install Trivy
        run: curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin "${TRIVY_VERSION}"
      - name: Dependency vulnerability scan (Trivy fs)
        run: trivy fs --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 .

  image-scan:
    runs-on: ubuntu-latest
    env:
      TRIVY_VERSION: v0.69.3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Install Trivy
        run: curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin "${TRIVY_VERSION}"
      # Install reporting + its reactor deps to the local repo first, then run jib on reporting ONLY
      # with the fully-qualified goal (the jib: prefix is declared per-service, not in the root pom,
      # and a command-line goal with -am would run against every reactor module). jib needs the
      # Docker daemon, which ubuntu-latest provides.
      - name: Build reporting + deps
        run: ./mvnw -B -ntp -pl services/reporting -am -DskipTests install
      - name: Build the reporting image (Jib -> local Docker)
        run: ./mvnw -B -ntp -pl services/reporting -DskipTests com.google.cloud.tools:jib-maven-plugin:3.4.4:dockerBuild
      # Report-only (does not fail the build): the image bundles framework libraries at their
      # Spring-Boot-BOM-managed versions (e.g. tomcat-embed-core, jackson), which periodically carry
      # HIGH/CRITICAL CVEs whose only fix is a coordinated Spring Boot BOM upgrade — not actionable
      # mid-phase and sometimes upstream-unpatched. The hard fail-gates are the fs dependency-scan
      # (declared deps + lockfiles — a deliberately introduced vulnerable dep fails there) and the
      # secret scan. Clearing the framework CVEs via a Boot BOM bump is tracked in docs/backlog.md.
      - name: Image scan (Trivy, informational)
        run: trivy image --pkg-types library --severity HIGH,CRITICAL --ignore-unfixed --exit-code 0 lms/reporting:0.1.0-SNAPSHOT
