spring:
  application:
    name: disbursement
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/disbursement}
    username: ${DB_USER:disbursement}
    password: ${DB_PASSWORD:disbursement}
  flyway:
    enabled: true
    # Service migrations start at V0100; the shared outbox/inbox location supplies V0001.
    locations: classpath:db/migration,classpath:db/migration/outbox
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER_URI:http://localhost:8180/realms/lms}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  port: ${SERVER_PORT:8105}

lms:
  currency:
    default: ${LMS_CURRENCY_DEFAULT:INR}
  kafka:
    schema-registry-url: ${SCHEMA_REGISTRY_URL:http://localhost:8081}
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
  sim:
    base-url: ${SIM_BASE_URL:http://localhost:8190}
  disbursement:
    otp-ttl-minutes: ${OTP_TTL_MINUTES:5}
    kyc-callback-url: ${KYC_CALLBACK_URL:http://localhost:8101/disbursements/kyc/callback}

management:
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
