spring:
  application:
    name: disbursement
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/disbursement}
    username: ${DB_USER:disbursement}
    password: ${DB_PASSWORD:disbursement}
  flyway:
    enabled: true
    # Service migrations start at V0100; the shared outbox/inbox location supplies V0001.
    locations: classpath:db/migration,classpath:db/migration/outbox
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER_URI:http://localhost:8180/realms/lms}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  port: ${SERVER_PORT:8105}

lms:
  currency:
    default: ${LMS_CURRENCY_DEFAULT:INR}
  kafka:
    schema-registry-url: ${SCHEMA_REGISTRY_URL:http://localhost:8081}
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
  sim:
    base-url: ${SIM_BASE_URL:http://localhost:8190}
  callback:
    secret: ${LMS_CALLBACK_SECRET:local-dev-callback-secret}
    tolerance-seconds: ${CALLBACK_TOLERANCE_SECONDS:300}
  temporal:
    target: ${TEMPORAL_TARGET:127.0.0.1:7233}
    task-queue: ${TEMPORAL_TASK_QUEUE:disbursement}
    ui-base-url: ${TEMPORAL_UI_BASE_URL:http://localhost:8233}
  rail:
    retry:
      max-attempts: ${RAIL_RETRY_MAX_ATTEMPTS:3}
      wait-ms: ${RAIL_RETRY_WAIT_MS:200}
  disbursement:
    callback-url: ${DISBURSEMENT_CALLBACK_URL:http://localhost:8105/callbacks/rail}
    # 30-minute payout timeout in production; the e2e/tests override to seconds.
    payout-timeout-seconds: ${PAYOUT_TIMEOUT_SECONDS:1800}
    poll-rounds: ${PAYOUT_POLL_ROUNDS:5}
    poll-backoff-seconds: ${PAYOUT_POLL_BACKOFF_SECONDS:30}
    max-attempts: ${PAYOUT_MAX_ATTEMPTS:3}
    retry-backoff-seconds: ${PAYOUT_RETRY_BACKOFF_SECONDS:5}
    retry-multiplier: ${PAYOUT_RETRY_MULTIPLIER:2.0}
    activity-timeout-seconds: ${PAYOUT_ACTIVITY_TIMEOUT_SECONDS:30}

management:
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
