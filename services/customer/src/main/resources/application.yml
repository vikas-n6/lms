spring:
  application:
    name: customer
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/customer}
    username: ${DB_USER:customer}
    password: ${DB_PASSWORD:customer}
  flyway:
    enabled: true
    # Service migrations start at V0100; the shared outbox/inbox location supplies V0001.
    locations: classpath:db/migration,classpath:db/migration/outbox
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER_URI:http://localhost:8180/realms/lms}

server:
  port: ${SERVER_PORT:8101}

lms:
  currency:
    default: ${LMS_CURRENCY_DEFAULT:INR}
  kafka:
    schema-registry-url: ${SCHEMA_REGISTRY_URL:http://localhost:8081}
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}

management:
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
