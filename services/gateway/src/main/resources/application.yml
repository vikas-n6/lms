spring:
  application:
    name: gateway
  threads:
    virtual:
      enabled: true          # gateway runs on virtual threads (CLAUDE.md)
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER_URI:http://localhost:8180/realms/lms}
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: customer
              uri: ${CUSTOMER_URI:http://localhost:8101}
              predicates:
                - Path=/api/customers/**
              filters:
                - RewritePath=/api/(?<segment>.*), /$\{segment}
            - id: origination
              uri: ${ORIGINATION_URI:http://localhost:8102}
              predicates:
                - Path=/api/applications/**
              filters:
                - RewritePath=/api/(?<segment>.*), /$\{segment}
            - id: decision
              uri: ${DECISION_URI:http://localhost:8103}
              predicates:
                - Path=/api/decisions/**
              filters:
                - RewritePath=/api/(?<segment>.*), /$\{segment}
            - id: loan-account
              uri: ${LOAN_ACCOUNT_URI:http://localhost:8104}
              predicates:
                - Path=/api/loans/**,/api/admin/jobs/**,/api/admin/loans/**
              filters:
                - RewritePath=/api/(?<segment>.*), /$\{segment}
            - id: ledger
              uri: ${LEDGER_URI:http://localhost:8108}
              predicates:
                - Path=/api/journal-entries/**,/api/ledger/**
              filters:
                - RewritePath=/api/(?<segment>.*), /$\{segment}
            - id: disbursement
              uri: ${DISBURSEMENT_URI:http://localhost:8105}
              predicates:
                - Path=/api/disbursements/**
              filters:
                - RewritePath=/api/(?<segment>.*), /$\{segment}
            - id: repayment
              uri: ${REPAYMENT_URI:http://localhost:8106}
              predicates:
                - Path=/api/repayments/**,/api/mandates/**
              filters:
                - RewritePath=/api/(?<segment>.*), /$\{segment}
            - id: simulators
              uri: ${SIM_URI:http://localhost:8190}
              predicates:
                - Path=/api/sim/**
              filters:
                - RewritePath=/api/(?<segment>.*), /$\{segment}
            # Signed provider callbacks bypass JWT (the service verifies the signature) and keep
            # their path (no /api rewrite), so the signed body the service verifies is unchanged.
            - id: callbacks-rail
              uri: ${DISBURSEMENT_URI:http://localhost:8105}
              predicates:
                - Path=/callbacks/rail
            - id: callbacks-repayment
              uri: ${REPAYMENT_URI:http://localhost:8106}
              predicates:
                - Path=/callbacks/payments,/callbacks/mandates

server:
  port: ${SERVER_PORT:8080}

lms:
  gateway:
    ratelimit:
      redis: ${RATELIMIT_REDIS:false}
    services:
      customer: ${CUSTOMER_URI:http://localhost:8101}
      origination: ${ORIGINATION_URI:http://localhost:8102}
      decision: ${DECISION_URI:http://localhost:8103}
      loan-account: ${LOAN_ACCOUNT_URI:http://localhost:8104}
      ledger: ${LEDGER_URI:http://localhost:8108}
      simulators: ${SIM_URI:http://localhost:8190}

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
