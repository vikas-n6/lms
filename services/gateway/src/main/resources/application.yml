spring:
  application:
    name: gateway
  threads:
    virtual:
      enabled: true          # gateway runs on virtual threads (CLAUDE.md)
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER_URI:http://localhost:8180/realms/lms}
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: customer
              uri: ${CUSTOMER_URI:http://localhost:8101}
              predicates:
                - Path=/api/customers/**
              filters:
                - RewritePath=/api/(?<segment>.*), /$\{segment}

server:
  port: ${SERVER_PORT:8080}

lms:
  gateway:
    ratelimit:
      redis: ${RATELIMIT_REDIS:false}
    services:
      customer: ${CUSTOMER_URI:http://localhost:8101}

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
