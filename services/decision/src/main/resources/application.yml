spring:
  application:
    name: decision
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/decision}
    username: ${DB_USER:decision}
    password: ${DB_PASSWORD:decision}
  flyway:
    enabled: true
    # Service migrations start at V0100; the shared outbox/inbox location supplies V0001.
    locations: classpath:db/migration,classpath:db/migration/outbox
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER_URI:http://localhost:8180/realms/lms}

server:
  port: ${SERVER_PORT:8103}

lms:
  currency:
    default: ${LMS_CURRENCY_DEFAULT:INR}
  kafka:
    schema-registry-url: ${SCHEMA_REGISTRY_URL:http://localhost:8081}
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
  sim:
    base-url: ${SIM_BASE_URL:http://localhost:8190}
  decision:
    current-rule-set: ${DECISION_RULE_SET:v1}
    assessment:
      apr-percent: ${DECISION_ASSESSMENT_APR:24}
      tenor-months: ${DECISION_ASSESSMENT_TENOR:12}
    velocity:
      window-hours: ${DECISION_VELOCITY_WINDOW_HOURS:24}

management:
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
