spring:
  application:
    name: reporting
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/reporting}
    username: ${DB_USER:reporting}
    password: ${DB_PASSWORD:reporting}
  flyway:
    enabled: true
    # Service migrations start at V0100; the shared outbox/inbox location supplies V0001 (inbox).
    locations: classpath:db/migration,classpath:db/migration/outbox
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER_URI:http://localhost:8180/realms/lms}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  port: ${SERVER_PORT:8110}

lms:
  currency:
    default: ${LMS_CURRENCY_DEFAULT:INR}
  kafka:
    schema-registry-url: ${SCHEMA_REGISTRY_URL:http://localhost:8081}
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
  reporting:
    # 00:30 IST daily; business date comes from the shared BusinessCalendar, not wall-clock.
    snapshot-cron: ${REPORTING_SNAPSHOT_CRON:0 30 0 * * *}

management:
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
