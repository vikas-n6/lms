spring:
  application:
    name: collections
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/collections}
    username: ${DB_USER:collections}
    password: ${DB_PASSWORD:collections}
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/migration/outbox
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER_URI:http://localhost:8180/realms/lms}

server:
  port: ${SERVER_PORT:8107}

lms:
  kafka:
    schema-registry-url: ${SCHEMA_REGISTRY_URL:http://localhost:8081}
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
  temporal:
    target: ${TEMPORAL_TARGET:127.0.0.1:7233}
    task-queue: ${TEMPORAL_TASK_QUEUE:collections}
  # Dunning plan as versioned configuration (CLAUDE.md: never hard-coded in Java). A case pins the
  # version it was opened under. Thresholds and templates per docs + phase prompt task 4.
  dunning:
    version: 1
    steps:
      - { stepId: DPD_1_SMS,          dpdThreshold: 1,   actionType: SMS,                 channel: SMS,   templateId: collections.dpd1 }
      - { stepId: DPD_3_SMS_EMAIL,    dpdThreshold: 3,   actionType: SMS_EMAIL,           channel: SMS,   templateId: collections.dpd3 }
      - { stepId: DPD_7_SMS_REPRESENT, dpdThreshold: 7,  actionType: SMS_REPRESENT,       channel: SMS,   templateId: collections.dpd7 }
      - { stepId: DPD_15_ESCALATE,    dpdThreshold: 15,  actionType: ESCALATE,            channel: NONE,  templateId: "" }
      - { stepId: DPD_30_FORMAL,      dpdThreshold: 30,  actionType: FORMAL_NOTICE,       channel: EMAIL, templateId: collections.dpd30 }
      - { stepId: DPD_60_FINAL,       dpdThreshold: 60,  actionType: FINAL_NOTICE,        channel: EMAIL, templateId: collections.dpd60 }
      - { stepId: DPD_91_NPA,         dpdThreshold: 91,  actionType: NPA_REVIEW,          channel: NONE,  templateId: "" }
      - { stepId: DPD_180_WRITE_OFF,  dpdThreshold: 180, actionType: RECOMMEND_WRITE_OFF, channel: NONE,  templateId: "" }

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
