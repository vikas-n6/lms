global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Spring Boot services expose /actuator/prometheus (micrometer-registry-prometheus).
  - job_name: lms-services
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - "customer:8101"
          - "origination:8102"
          - "decision:8103"
          - "loan-account:8104"
          - "disbursement:8105"
          - "repayment:8106"
          - "collections:8107"
          - "ledger:8108"
          - "notification:8109"
          - "reporting:8110"
          - "gateway:8080"
        labels:
          system: lms
