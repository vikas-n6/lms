global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Spring Boot services expose /actuator/prometheus (micrometer-registry-prometheus).
  - job_name: lms-services
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["customer:8101", "gateway:8080"]
        labels:
          system: lms
